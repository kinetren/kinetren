# A pushed `v*` tag becomes a GitHub Release with the portable tarball and its
# .sha256 (capability `distribution`, change github-ci-docker-build).
#
# The tarball is built by src/scripts/release-build.sh through
# src/packaging/Dockerfile, exactly as `make` does locally, so the delivery
# checks (no libav* in ldd, glibc <= 2.35) run on every release. Files go to
# the release itself: release assets count toward no storage quota, and no
# workflow artifact is uploaded. Old releases are never deleted here.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # the version string is the commit date + hash (kt-version), and the
          # ancestry check below needs the default branch's history
          fetch-depth: 0

      - name: The tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$GITHUB_REF_NAME is not on $DEFAULT_BRANCH; releases are cut from the default branch only"
            exit 1
          fi

      - name: Build the tarball in the build container
        run: src/scripts/release-build.sh

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd src/target/dist-out
          PRE=()
          case "$TAG" in *-*) PRE=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${PRE[@]}" \
            kinetren-*.tar.gz kinetren-*.tar.gz.sha256
