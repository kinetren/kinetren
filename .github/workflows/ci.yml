# Every push and pull request: build, clippy, workspace tests, repository
# guards (capability `distribution`, change github-ci-docker-build); and the
# Windows tests (change windows-build): the cross-built nextest archive runs on a
# real windows-latest runner — nothing is compiled there.
#
# Not here, on purpose: GPU conformance (no adapter on the runner — those tests
# skip themselves) and the live Xvfb scenarios; both stay in finish.sh on a
# real machine. Nothing is uploaded except the test log of a failed run, kept
# for 3 days: on GitHub only releases are kept.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # must equal ARG RUST_TOOLCHAIN in src/packaging/Dockerfile (dist-check.py)
  RUST_TOOLCHAIN: "1.97.1"
  # src/.cargo/config.toml links with mold, which the runner does not have;
  # an empty RUSTFLAGS overrides it, exactly as in the build container
  RUSTFLAGS: ""
  # debuginfo only: the dev profile keeps opt-level, overflow checks and
  # debug_assert!, which the tests are written against; full debuginfo would
  # not fit the runner's disk
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - name: System packages
        # ffmpeg: the runtime libraries (6.x) are loaded by dlopen, and the
        # binary generates test fixtures (src/fixtures/gen.sh).
        # xvfb/openbox/python3-xlib: the guards of the live framework (t801,
        # t802) run its dummy scenarios; they skip without Xvfb, so install it
        # explicitly instead of depending on what the runner image carries;
        # x11-utils: xdpyinfo, which t809 calls to read the screen it compares against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libasound2-dev ffmpeg \
            xvfb openbox python3-xlib x11-utils

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          # pull requests and side branches read the cache, only the default
          # branch writes it (the Actions cache is capped at 10 GB per repo)
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build kinetren and kt-cli
        # what people run, as the first stage of finish.sh; the live-framework
        # guards look for target/debug/kinetren
        working-directory: src
        run: cargo build -p kt-app -p kt-cli

      - name: Clippy
        working-directory: src
        run: cargo clippy --workspace --all-targets

      - name: Tests
        working-directory: src
        # nextest, as finish.sh: under `cargo test` t663 times out (R.68)
        run: |
          set -o pipefail
          cargo nextest run --workspace --no-fail-fast 2>&1 | tee ../nextest.log

      - name: Repository guards
        run: |
          python3 src/scripts/readme-check.py --check
          python3 src/scripts/dist-check.py --check
          python3 src/scripts/specs-user-path.py --check

      - name: Disk usage
        if: always()
        run: df -h / && du -sh src/target 2>/dev/null || true

      - name: Upload the test log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-log
          path: nextest.log
          retention-days: 3

  windows-build:
    # The Windows test binaries are cross-built in the `windows` stage of the build
    # container (one toolchain: the owner's choice), with the fixtures generated on
    # Linux; both travel to the windows-latest job and expire after a day.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          bash src/fixtures/gen.sh

      - name: Build container (windows stage)
        working-directory: src
        run: docker build --network=host --target windows -t kinetren-build:windows -f packaging/Dockerfile packaging

      - name: Windows test archive
        # the repository at /kt, the build in /kt/src: the compile-time paths of the tests
        # are /kt/src/…, which the Windows job makes valid with a junction D:\kt
        run: |
          docker run --rm --network=host -u "$(id -u):$(id -g)" -v "$PWD:/kt" -w /kt/src \
            -e CARGO_TARGET_DIR=/kt/src/target/win-container -e RUSTFLAGS= -e CARGO_PROFILE_DEV_DEBUG=0 \
            kinetren-build:windows \
            cargo nextest archive --target x86_64-pc-windows-gnu --workspace \
              --archive-file /kt/src/target/windows-tests.tar.zst

      - name: Upload the archive and the fixtures for the Windows job
        uses: actions/upload-artifact@v4
        with:
          name: windows-tests
          path: |
            src/target/windows-tests.tar.zst
            src/fixtures/out
          retention-days: 1

  windows-test:
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Download the archive and the fixtures
        uses: actions/download-artifact@v4
        with:
          name: windows-tests
          path: src

      - name: The pinned FFmpeg build (gyan.dev 8.1.2, hash checked)
        # the same pin as the program's Download button and scripts/fetch-ffmpeg-win.sh
        run: |
          curl -fsSL --retry 3 -o ffmpeg.7z https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-8.1.2-full_build-shared.7z
          echo "cba748035c21ce1431d0823c7a3a711f38616f89f87a265dceddf9b7f6749d2d  ffmpeg.7z" | sha256sum -c
          7z e -y -bd -osrc/target/ffmpeg-win/8.1.2 ffmpeg.7z '*/bin/*.dll' '*/LICENSE' > /dev/null
          ls src/target/ffmpeg-win/8.1.2

      - name: The checkout where the tests' compile-time paths point
        # /kt/src/… was baked in by the cross-build; on Windows a rooted path means the
        # current drive, so D:\kt must be the checkout
        shell: cmd
        run: mklink /J D:\kt "%GITHUB_WORKSPACE%"

      - name: Tests (the cross-built archive, no compilation)
        working-directory: src
        env:
          KT_FFMPEG_WIN_DIR: ${{ github.workspace }}\src\target\ffmpeg-win\8.1.2
          KINETREN_FFMPEG_DIR: ${{ github.workspace }}\src\target\ffmpeg-win\8.1.2
        run: |
          set -o pipefail
          cargo nextest run --archive-file target/windows-tests.tar.zst --workspace-remap /d/kt/src \
            --no-fail-fast 2>&1 | tee ../nextest-windows.log

      - name: Upload the test log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-windows-log
          path: nextest-windows.log
          retention-days: 3
