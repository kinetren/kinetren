# Every push and pull request: build, clippy, workspace tests, repository
# guards (capability `distribution`, change github-ci-docker-build); and the
# Windows tests (change windows-build): the cross-built nextest archive runs on a
# real windows-latest runner — nothing is compiled there; and the FFmpeg tests
# against FFmpeg 9 built from source in Docker (change ffmpeg-9).
#
# Not here, on purpose: GPU conformance (no adapter on the runner — those tests
# skip themselves) and the live Xvfb scenarios; both stay in finish.sh on a
# real machine. Nothing is uploaded except the test log of a failed run, kept
# for 3 days: on GitHub only releases are kept.
#
# Caches (change ci-speedup): every job that compiles restores one, and only a run on the
# default branch writes one, so side branches cannot evict master's from the repository's
# 10 GB. A key names what decides the content (toolchain, Cargo.lock, Dockerfile, manifest).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # must equal ARG RUST_TOOLCHAIN in src/packaging/Dockerfile (dist-check.py)
  RUST_TOOLCHAIN: "1.97.1"
  # src/.cargo/config.toml links with mold, which the runner does not have;
  # an empty RUSTFLAGS overrides it, exactly as in the build container
  RUSTFLAGS: ""
  # debuginfo only: the dev profile keeps opt-level, overflow checks and
  # debug_assert!, which the tests are written against; full debuginfo would
  # not fit the runner's disk
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        # ffmpeg: the runtime libraries (6.x) are loaded by dlopen, and the
        # binary generates test fixtures (src/fixtures/gen.sh).
        # xvfb/openbox/python3-xlib: the guards of the live framework (t801,
        # t802) run its dummy scenarios; they skip without Xvfb, so install it
        # explicitly instead of depending on what the runner image carries;
        # x11-utils, x11-apps, imagemagick: xdpyinfo, xwd and convert, which t809 calls
        # to read the screen it compares against; shared-mime-info, xdg-utils:
        # update-mime-database and xdg-mime, which t935 runs to tell our `.kt` from Kotlin;
        # libfile-mimeinfo-perl: `mimetype`, which xdg-mime asks without a desktop (a Recommends
        # of xdg-utils — without it libmagic called our project JSON; dist-check, t1060);
        # libglib2.0-bin: `gio`, the oracle t935 asks as a file manager does (perl's `mimetype`
        # takes the first of two equal-weight globs unread; t1380)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libasound2-dev ffmpeg \
            xvfb openbox python3-xlib x11-utils x11-apps imagemagick \
            shared-mime-info libglib2.0-bin xdg-utils libfile-mimeinfo-perl

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          # pull requests and side branches read the cache, only the default
          # branch writes it (the Actions cache is capped at 10 GB per repo)
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build kinetren and kt-cli
        # what people run, as the first stage of finish.sh; the live-framework
        # guards look for target/debug/kinetren
        working-directory: src
        run: cargo build -p kt-app -p kt-cli

      - name: Clippy
        working-directory: src
        run: cargo clippy --workspace --all-targets

      - name: Tests
        working-directory: src
        # nextest, as finish.sh: under `cargo test` t663 times out (R.68)
        run: |
          set -o pipefail
          cargo nextest run --workspace --no-fail-fast 2>&1 | tee ../nextest.log

      - name: Repository guards
        run: |
          python3 src/scripts/readme-check.py --check
          python3 src/scripts/dist-check.py --check
          python3 src/scripts/specs-user-path.py --check

      - name: Disk usage
        if: always()
        run: df -h / && du -sh src/target 2>/dev/null || true

      - name: Upload the test log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-log
          path: nextest.log
          retention-days: 3

  flatpak:
    # The Flatpak (change flatpak-flathub, D9): built with flatpak-builder against the Flathub
    # runtime, linted, its metainfo validated, and the sandbox's software path checked (the
    # runtime's FFmpeg, a libx264 + AAC export that decodes — flatpak-check.sh). The runner has
    # no GPU: hardware encoding stays a manual check. Nothing is uploaded.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: flatpak, flatpak-builder, appstream
        # elfutils: flatpak-builder strips with eu-strip, a Recommends that
        # --no-install-recommends drops (dist-check, t1060); librsvg2-common: gdk-pixbuf's SVG
        # loader, which appstreamcli compose needs to read our icon (a Recommends of librsvg2-2; t1380);
        # webp-pixbuf-loader: its WebP loader, for the screenshots; ppa:flatpak/stable: flatpak-builder
        # 1.4.6+, which mirrors the screenshots as Flathub's linter wants (Ubuntu 24.04 has 1.4.2; t1410)
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder appstream elfutils librsvg2-common webp-pixbuf-loader

      - name: The flatpak-builder cache
        id: builder-cache
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('src/packaging/flatpak/*.yml', 'src/packaging/flatpak/cargo-sources.json') }}
          restore-keys: flatpak-builder-

      - name: Build, lint and check the Flatpak
        env:
          KT_FLATPAK_CCACHE: "1"
        run: src/scripts/flatpak-build.sh

      - name: Keep only the third-party artifacts
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.builder-cache.outputs.cache-hit != 'true'
        working-directory: src
        # this job installs no toolchain: cargo is the runner image's; housekeeping must not fail a check
        continue-on-error: true
        run: |
          cargo metadata --no-deps --format-version 1 --offline > "$RUNNER_TEMP/metadata.json"
          python3 scripts/ci-cache-prune.py ../.flatpak-builder/ccache/target "$RUNNER_TEMP/metadata.json"

      - name: Save the flatpak-builder cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.builder-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .flatpak-builder
          key: ${{ steps.builder-cache.outputs.cache-primary-key }}

  ffmpeg9:
    # FFmpeg 9 on Linux (change ffmpeg-9): the FFmpeg tests against shared FFmpeg 9.0.2,
    # built from the official source in the `ffmpeg-test` stage of the build container (for
    # tests only, never shipped). KT_EXPECT_FFMPEG_MAJOR fails the run unless FFmpeg 9 is what
    # loaded (t865). The image is cached by the Dockerfile's hash, so FFmpeg is compiled only
    # when the recipe changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KT_EXPECT_FFMPEG_MAJOR: "9"
    steps:
      - uses: actions/checkout@v4

      - name: Fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          bash src/fixtures/gen.sh

      - name: The ffmpeg-test image from the cache
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ffmpeg-test-image.tar.gz
          key: ffmpeg-test-image-${{ hashFiles('src/packaging/Dockerfile') }}

      - name: Load or build the ffmpeg-test image
        working-directory: src
        run: |
          if [ -f /tmp/ffmpeg-test-image.tar.gz ]; then
            docker load < /tmp/ffmpeg-test-image.tar.gz
          else
            docker build --network=host --target ffmpeg-test -t kinetren-build:ffmpeg-test -f packaging/Dockerfile packaging
            docker save kinetren-build:ffmpeg-test | gzip -1 > /tmp/ffmpeg-test-image.tar.gz
          fi

      - name: Save the ffmpeg-test image
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/ffmpeg-test-image.tar.gz
          key: ${{ steps.image-cache.outputs.cache-primary-key }}

      - name: The third-party artifacts and the crate registry from the cache
        id: target-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/target/ffmpeg-test-container
            ~/.cargo/registry
          key: ffmpeg-test-target-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('src/packaging/Dockerfile') }}-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: ffmpeg-test-target-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('src/packaging/Dockerfile') }}-

      - name: FFmpeg tests against FFmpeg 9
        env:
          KT_FFMPEG_TEST_IMAGE_READY: "1"
        run: |
          set -o pipefail
          mkdir -p ~/.cargo/registry
          src/scripts/ffmpeg-test.sh 2>&1 | tee nextest-ffmpeg9.log

      - name: Keep only the third-party artifacts
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.target-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/kt" -w /kt/src kinetren-build:ffmpeg-test \
            cargo metadata --no-deps --format-version 1 --offline > "$RUNNER_TEMP/metadata.json"
          python3 src/scripts/ci-cache-prune.py src/target/ffmpeg-test-container "$RUNNER_TEMP/metadata.json"

      - name: Save the third-party artifacts and the crate registry
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src/target/ffmpeg-test-container
            ~/.cargo/registry
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

      - name: Upload the test log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-ffmpeg9-log
          path: nextest-ffmpeg9.log
          retention-days: 3

  windows-build:
    # The Windows test binaries are cross-built in the `windows-cross` stage of the build
    # container (one toolchain: the owner's choice), with the fixtures generated on
    # Linux; both travel to the windows-latest job and expire after a day.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          bash src/fixtures/gen.sh

      - name: The windows-cross image from the cache
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/windows-cross-image.tar.gz
          key: windows-cross-image-${{ hashFiles('src/packaging/Dockerfile') }}

      - name: Load or build the build container (windows-cross stage)
        working-directory: src
        # nothing here runs a Windows binary, so the job does not carry wine (most of `windows`)
        run: |
          if [ -f /tmp/windows-cross-image.tar.gz ]; then
            docker load < /tmp/windows-cross-image.tar.gz
          else
            docker build --network=host --target windows-cross -t kinetren-build:windows-cross -f packaging/Dockerfile packaging
            docker save kinetren-build:windows-cross | gzip -1 > /tmp/windows-cross-image.tar.gz
          fi

      - name: Save the windows-cross image
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/windows-cross-image.tar.gz
          key: ${{ steps.image-cache.outputs.cache-primary-key }}

      - name: The third-party artifacts and the crate registry from the cache
        id: target-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/target/win-container
            ~/.cargo/registry
          key: windows-target-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('src/packaging/Dockerfile') }}-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: windows-target-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('src/packaging/Dockerfile') }}-

      - name: Windows test archive
        # the repository at /kt, the build in /kt/src: the compile-time paths of the tests
        # are /kt/src/…, which the Windows job makes valid with a junction D:\kt
        run: |
          mkdir -p ~/.cargo/registry
          docker run --rm --network=host -u "$(id -u):$(id -g)" -v "$PWD:/kt" -w /kt/src \
            -v "$(src/scripts/cargo-registry.sh kinetren-build:windows-cross):/usr/local/cargo/registry" \
            -e CARGO_TARGET_DIR=/kt/src/target/win-container -e RUSTFLAGS= -e CARGO_PROFILE_DEV_DEBUG=0 -e CARGO_INCREMENTAL=0 \
            kinetren-build:windows-cross \
            cargo nextest archive --target x86_64-pc-windows-gnu --workspace \
              --archive-file /kt/src/target/windows-tests.tar.zst

      - name: Upload the archive and the fixtures for the Windows job
        uses: actions/upload-artifact@v4
        with:
          name: windows-tests
          path: |
            src/target/windows-tests.tar.zst
            src/fixtures/out
          retention-days: 1

      - name: Keep only the third-party artifacts
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.target-cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "$PWD:/kt" -w /kt/src kinetren-build:windows-cross \
            cargo metadata --no-deps --format-version 1 --offline > "$RUNNER_TEMP/metadata.json"
          python3 src/scripts/ci-cache-prune.py src/target/win-container "$RUNNER_TEMP/metadata.json"

      - name: Save the third-party artifacts and the crate registry
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src/target/win-container
            ~/.cargo/registry
          key: ${{ steps.target-cache.outputs.cache-primary-key }}

  windows-test:
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Download the archive and the fixtures
        uses: actions/download-artifact@v4
        with:
          name: windows-tests
          path: src

      - name: The pinned FFmpeg build (gyan.dev 9.0.2, hash checked)
        # the same pin as the program's Download button and scripts/fetch-ffmpeg-win.sh
        # (dist-check.py, t860, keeps the three equal); FFmpeg 6/7/8 on Windows are covered
        # by the pure search-plan tests (owner, ffmpeg-9: "CI tests 9 only")
        run: |
          curl -fsSL --retry 3 -o ffmpeg.7z https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-full_build-shared.7z
          echo "4d2060a8b34a940aa47d785142055bb92a63053781e55f2ace4546edd519a8f5  ffmpeg.7z" | sha256sum -c
          7z e -y -bd -osrc/target/ffmpeg-win/9.0.2 ffmpeg.7z '*/bin/*.dll' '*/LICENSE' > /dev/null
          ls src/target/ffmpeg-win/9.0.2

      - name: The checkout where the tests' compile-time paths point
        # /kt/src/… was baked in by the cross-build; on Windows a rooted path means the
        # current drive, so D:\kt must be the checkout
        shell: cmd
        run: mklink /J D:\kt "%GITHUB_WORKSPACE%"

      - name: Tests (the cross-built archive, no compilation)
        working-directory: src
        env:
          KT_FFMPEG_WIN_DIR: ${{ github.workspace }}\src\target\ffmpeg-win\9.0.2
          KINETREN_FFMPEG_DIR: ${{ github.workspace }}\src\target\ffmpeg-win\9.0.2
        run: |
          set -o pipefail
          cargo nextest run --archive-file target/windows-tests.tar.zst --workspace-remap /d/kt/src \
            --no-fail-fast 2>&1 | tee ../nextest-windows.log

      - name: Upload the test log of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-windows-log
          path: nextest-windows.log
          retention-days: 3
