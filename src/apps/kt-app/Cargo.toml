[package]
name = "kt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The program people run is called `kinetren` (owner, 2026-10-22: "при билде и
# распространении надо называть не kt-app … а kinetren"). The package keeps its
# internal name, so `cargo run -p kt-app` and `-p kt-app` in test commands stay.
[[bin]]
name = "kinetren"
path = "src/main.rs"

[dependencies]
kt-time = { workspace = true }
kt-version = { workspace = true }
kt-model = { workspace = true }
# «глифа нет» в окне титра считает тот же крейт, что рисует кадр (Р.52)
kt-text = { workspace = true }
kt-otio = { workspace = true }
kt-media = { workspace = true }
kt-cache = { workspace = true }
kt-engine = { workspace = true }
# график АЧХ считает kt_fx::eq_mag_db — теми же коэффициентами, что звучат
kt-fx = { workspace = true }
kt-gpu = { workspace = true }
eframe = { workspace = true }
cpal = { workspace = true }
rtrb = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
xxhash-rust = { workspace = true }
rfd = "0.15"
# СИСТЕМНЫЙ буфер обмена читается по нажатию, своего зеркала у программы нет
# (Р.61). Крейт уже в дереве через egui-winit — новых зависимостей не появляется.
arboard = "3.6"
serde_json.workspace = true
# порядок арабского текста (Р.19): egui 0.36 шейпит вязь, но не переупорядочивает
unicode-bidi = "0.3"
# anonymous usage telemetry (change telemetry-posthog): our own PostHog capture client on a
# blocking HTTP client; rustls with bundled roots — no OpenSSL, nothing new in `ldd`
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
getrandom = "0.3"

# каталоги перевода компилируются в статические таблицы (apps/kt-app/build.rs)
[build-dependencies]
unicode-bidi = "0.3"

# harness-тесты вёрстки и интеракций (правило п.9 р.8): без wgpu/snapshot —
# чистый CPU, без окна и GPU
[dev-dependencies]
egui_kittest = { version = "0.36.1", default-features = false }
# проверка покрытия глифов (тест 100, п.12 р.11); версия уже в графе egui
ab_glyph = "0.2"

# позиция курсора при DnD файлов: winit/X11 не отдаёт координаты
# XdndPosition (п.2 v1.4) — читаем указатель напрямую
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

# flock для замка на проект (п.352): ядро снимает его при любой смерти
# процесса — свойство, которого нет ни у одного замка «своими руками»
[target.'cfg(unix)'.dependencies]
libc = "0.2"
