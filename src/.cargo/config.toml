# Линкер мастерской — mold (Р.68, прямая просьба владельца: «п.1 + mold …»).
#
# Дерево большое: kt-app в debug — 705 МБ, тестовых бинарей 96, и каждая
# правка в kt-model перелинковывает почти всё. Замер до/после — в
# openspec/changes/…/tasks.md (задача 2.1) и в отчёте раунда.
#
# Флаг едет через link-arg, а не через `linker = "clang"`: менять драйвер
# компоновки незачем — gcc 13 понимает `-fuse-ld=mold` сам, а mold стоит в
# системе (2.30.0, /usr/bin/ld.mold).
#
# ПОСТАВКА ЭТОТ ФАЙЛ НЕ ВИДИТ: scripts/release-build.sh гасит RUSTFLAGS у
# контейнера Ubuntu 22.04 (там gcc 11 и mold не установлен). Ускоритель
# разработки не имеет права стать условием сборки того, что уезжает людям —
# профили release/dist и инвариант №10 («ldd без libav*») не меняются.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
