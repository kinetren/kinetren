[package]
name = "kt-media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ffmpeg"]
# Без фичи крейт собирается без FFmpeg (синтетика, индекс-БД, тесты движка).
ffmpeg = ["dep:kt-ffmpeg"]

[dependencies]
kt-time = { workspace = true }
# Словарь генераторов (GeneratorKind, разбор gen:-пути) — Р.52. Ребро
# ациклично: kt-model зависит только от kt-time и serde.
kt-model = { workspace = true }
# Растеризация титров (правило детерминизма — kt-text/CLAUDE.md).
kt-text = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
xxhash-rust = { workspace = true }
kt-ffmpeg = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
