[package]
name = "kt-media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ffmpeg"]
# Без фичи крейт собирается без FFmpeg (синтетика, индекс-БД, тесты движка).
ffmpeg = ["dep:kt-ffmpeg"]

[dependencies]
kt-time = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
xxhash-rust = { workspace = true }
kt-ffmpeg = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
