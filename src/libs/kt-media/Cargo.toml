[package]
name = "kt-media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ffmpeg"]
# Without the feature the crate builds without FFmpeg (synthetics, index DB, engine tests).
ffmpeg = ["dep:kt-ffmpeg"]

[dependencies]
kt-time = { workspace = true }
# The generator vocabulary (GeneratorKind, parsing of the gen: path): R.52. The edge
# is acyclic: kt-model depends only on kt-time and serde.
kt-model = { workspace = true }
# Rasterization of titles (the determinism rule: kt-text/CLAUDE.md).
kt-text = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
xxhash-rust = { workspace = true }
kt-ffmpeg = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
