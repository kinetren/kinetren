[package]
name = "kt-plugins-builtin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The assembler of the built-in set (plugin-api-stage1, D6): only kt-app, kt-cli and test targets
# depend on it (t975); the registry it builds is handed to the core at run time.
[dependencies]
kt-plugin-api = { workspace = true }
fx-video-blur = { workspace = true }
fx-video-color = { workspace = true }
fx-video-stylize = { workspace = true }
fx-video-camera = { workspace = true }
fx-audio-tone = { workspace = true }
fx-audio-dynamics = { workspace = true }
fx-audio-modulation = { workspace = true }
fx-video-distort = { workspace = true }
transitions-basic = { workspace = true }
transitions-styled = { workspace = true }
transitions-volume = { workspace = true }
generators-basic = { workspace = true }
generators-test = { workspace = true }
generators-audio = { workspace = true }
