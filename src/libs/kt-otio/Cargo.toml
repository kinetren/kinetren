[package]
name = "kt-otio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kt-time = { workspace = true }
kt-model = { workspace = true }
serde = { workspace = true }
# preserve_order is required: passthrough of foreign fields/metadata keeps
# the key order of the document, and idempotent writing rests on this
serde_json = { workspace = true, features = ["preserve_order"] }
indexmap = { workspace = true }
thiserror = { workspace = true }
