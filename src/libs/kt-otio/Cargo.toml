[package]
name = "kt-otio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kt-time = { workspace = true }
kt-model = { workspace = true }
serde = { workspace = true }
# preserve_order is required: passthrough of foreign fields/metadata keeps
# the key order of the document, and idempotent writing rests on this
serde_json = { workspace = true, features = ["preserve_order"] }
indexmap = { workspace = true }
thiserror = { workspace = true }

# windows-build (design D6): MoveFileExW(REPLACE_EXISTING | WRITE_THROUGH) for the atomic replace
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# the built-in plugin set for the tests (plugin-api-stage1; dev only — t975)
kt-plugins-builtin = { workspace = true }
