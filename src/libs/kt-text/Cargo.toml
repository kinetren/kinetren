[package]
name = "kt-text"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# ПИНЫ ТОЧНЫЕ (правило детерминизма, CLAUDE.md этого крейта): байты
# титра — функция этих версий; их cargo update = осознанная
# перегенерация голденов. Версии совпадают с транзитивными у epaint —
# при будущем апгрейде egui в дереве ЗАКОННО появятся две.
harfrust = "=0.12.0"
ab_glyph = "=0.2.32"
# Перечисление и резолв СИСТЕМНЫХ семей (С4). Версия тоже точная: от
# порядка обхода/приоритета файлов зависит, КАКОЙ файл выберется под имя
# семьи, а путь+байты файла входят в идентичность кадра.
fontdb = "=0.24.0"
