[package]
name = "kt-text"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# EXACT PINS (the determinism rule, CLAUDE.md of this crate): the bytes
# of a title are a function of these versions; their cargo update is a deliberate
# regeneration of the goldens. The versions coincide with the transitive ones of epaint —
# on a future upgrade of egui two will LEGITIMATELY appear in the tree.
harfrust = "=0.12.0"
ab_glyph = "=0.2.32"
# Enumeration and resolution of SYSTEM families (C4). This version too is exact: the
# order of the file traversal/priority determines WHICH file is chosen under the name of a
# family, and the path+bytes of the file enter the identity of the frame.
fontdb = "=0.24.0"
