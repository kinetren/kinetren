[package]
name = "kt-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kt-time.workspace = true
kt-model.workspace = true
kt-media.workspace = true
kt-cache.workspace = true
kt-fx.workspace = true
# point-wise plugins are assembled into the passes (plugin-api-stage1, D5)
kt-plugin-api.workspace = true
kt-engine.workspace = true
wgpu.workspace = true
pollster.workspace = true
xxhash-rust.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
# t1652: the generators' shaders on D3D12 (gpu-render-hardening; dev only)
generators-basic = { workspace = true }
generators-test = { workspace = true }
# the built-in plugin set for the tests (plugin-api-stage1; dev only — t975)
kt-plugins-builtin = { workspace = true }
# the single-text Color Grade prototype (compute-backends, t1501)
fx-video-color = { workspace = true }
