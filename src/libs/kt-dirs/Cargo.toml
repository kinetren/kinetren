[package]
name = "kt-dirs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Per-user directories of the program (change windows-build, design D4). No dependencies
# but the Windows API for the known folders.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }
