[package]
name = "kt-dirs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Per-user directories of the program (change windows-build, design D4). No dependencies
# but the system's API: the known folders on Windows, the disk's free space and the folder mark
# a sync tool reads (project-cache-folder D3, D4).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem"] }
