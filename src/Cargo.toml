[workspace]
resolver = "3"
members = [
    "apps/kt-app",
    "apps/kt-cli",
    "libs/kt-time",
    "libs/kt-version",
    "libs/kt-model",
    "libs/kt-otio",
    "libs/kt-ffmpeg",
    "libs/kt-media",
    "libs/kt-cache",
    "libs/kt-fx",
    "libs/kt-engine",
    "libs/kt-gpu",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
kt-time = { path = "libs/kt-time" }
kt-version = { path = "libs/kt-version" }
kt-model = { path = "libs/kt-model" }
kt-otio = { path = "libs/kt-otio" }
kt-ffmpeg = { path = "libs/kt-ffmpeg" }
kt-media = { path = "libs/kt-media" }
kt-cache = { path = "libs/kt-cache" }
kt-fx = { path = "libs/kt-fx" }
kt-engine = { path = "libs/kt-engine" }
kt-gpu = { path = "libs/kt-gpu" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
crossbeam-channel = "0.5"
rtrb = "0.3"
eframe = { version = "0.36", features = ["persistence"] }
# ЖЁСТКО синхронно с wgpu внутри eframe (kt-gpu делит Arc<wgpu::Device>
# с egui-wgpu — другой мажор = несовместимые типы). Апгрейд только парой.
wgpu = "30"
pollster = "0.4"
glam = "0.30"
cpal = "0.16"
rubato = "0.16"
rusqlite = { version = "0.37", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
realfft = "3"

[profile.release]
# line tables вместо полных символов: полный debug раздувал target/release
# до 3+ ГБ, а для профайлинга достаточно строк (п.7 р.12)
debug = 1

# Релизная поставка: без debug-инфы (release с debug=true — 500+МБ),
# со strip и LTO. Собирается scripts/release-build.sh в контейнере со
# старым glibc — см. packaging/. panic=abort не ставим — семантика
# паник остаётся той же, что в тестируемых профилях.
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1

# Аудио-DSP и композитинг должны быть быстрыми и в dev-сборке.
#
# `package."*"` — это только ЗАВИСИМОСТИ; свои крейты он не покрывает, и до
# Р.43 они собирались с opt-level 0. На плотном монтаже пользователя
# аудио-рендер в dev уходил за 100 % реального времени (кольцо пустеет,
# растут callback-underrun'ы), в релизе то же место занимало 13 %.
# Замер `kt-cli probe … --time` на problems1 его проекта:
#   opt-level 0 — 119 %, 1 — 21 %, 2 — 15 % реального времени.
# Взят 1: задача решена, сборка остаётся быстрой, отладка живой. Проверки
# переполнения и debug_assert! от уровня оптимизации НЕ зависят и остаются
# включёнными — сеть безопасности dev-профиля цела (п.301).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
