[workspace]
resolver = "3"
members = [
    "apps/kt-app",
    "apps/kt-cli",
    "libs/kt-text",
    "libs/kt-time",
    "libs/kt-version",
    "libs/kt-dirs",
    "libs/kt-plugin-api",
    "libs/kt-model",
    "libs/kt-otio",
    "libs/kt-ffmpeg",
    "libs/kt-media",
    "libs/kt-cache",
    "libs/kt-fx",
    "libs/kt-engine",
    "libs/kt-gpu",
    "libs/kt-plugins-builtin",
    # the built-in plugin families (plugin-api-stage1, D6): leaves of the crate graph (t975)
    "plugins/fx-video-blur",
    "plugins/fx-video-color",
    "plugins/fx-video-stylize",
    "plugins/fx-audio-tone",
    "plugins/fx-audio-dynamics",
    "plugins/fx-audio-modulation",
    "plugins/fx-video-distort",
    "plugins/transitions-basic",
    "plugins/transitions-styled",
    "plugins/transitions-volume",
    "plugins/generators-basic",
    "plugins/generators-test",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
kt-time = { path = "libs/kt-time" }
kt-version = { path = "libs/kt-version" }
kt-dirs = { path = "libs/kt-dirs" }
kt-plugin-api = { path = "libs/kt-plugin-api" }
kt-model = { path = "libs/kt-model" }
kt-text = { path = "libs/kt-text" }
kt-otio = { path = "libs/kt-otio" }
kt-ffmpeg = { path = "libs/kt-ffmpeg" }
kt-media = { path = "libs/kt-media" }
kt-cache = { path = "libs/kt-cache" }
kt-fx = { path = "libs/kt-fx" }
kt-engine = { path = "libs/kt-engine" }
kt-gpu = { path = "libs/kt-gpu" }
kt-plugins-builtin = { path = "libs/kt-plugins-builtin" }
fx-video-blur = { path = "plugins/fx-video-blur" }
fx-video-color = { path = "plugins/fx-video-color" }
fx-video-stylize = { path = "plugins/fx-video-stylize" }
fx-audio-tone = { path = "plugins/fx-audio-tone" }
fx-audio-dynamics = { path = "plugins/fx-audio-dynamics" }
fx-audio-modulation = { path = "plugins/fx-audio-modulation" }
fx-video-distort = { path = "plugins/fx-video-distort" }
transitions-basic = { path = "plugins/transitions-basic" }
transitions-styled = { path = "plugins/transitions-styled" }
transitions-volume = { path = "plugins/transitions-volume" }
generators-basic = { path = "plugins/generators-basic" }
generators-test = { path = "plugins/generators-test" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
crossbeam-channel = "0.5"
rtrb = "0.3"
eframe = { version = "0.36", features = ["persistence"] }
# STRICTLY in sync with wgpu inside eframe (kt-gpu shares Arc<wgpu::Device>
# with egui-wgpu — a different major = incompatible types). Upgrade only as a pair.
wgpu = "30"
pollster = "0.4"
glam = "0.30"
cpal = "0.16"
rubato = "0.16"
# the one math of the frozen paths (kt_plugin_api::math, ci-green-again): pure Rust, the same
# bytes on every platform and CPU — the platform libm differs between glibc and mingw
libm = "0.2.16"
rusqlite = { version = "0.37", features = ["bundled"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
realfft = "3"

[profile.release]
# line tables instead of full symbols: full debug bloated target/release
# to 3+ GB, while line tables are enough for profiling (item 7 round 12)
debug = 1

# Release shipment: without debug info (release with debug=true — 500+ MB),
# with strip and LTO. Built by scripts/release-build.sh in a container with
# an old glibc — see packaging/. We do not set panic=abort — the semantics
# of panics stays the same as in the tested profiles.
[profile.dist]
inherits = "release"
# R.49 item 355: function names in the shipment STAY. The panic hook writes
# a backtrace, and a report of bare addresses is theater: it cannot be parsed by
# the user, nor by us (each build is its own). `strip = "debuginfo"`
# removes heavy debug information (line numbers, types), but keeps the
# symbol table; `debug = 1` fills it with content.
# The cost was measured on this branch: binary 28.5 → 33.6 MiB (+5.1 MiB, +18 %),
# in the tarball (gzip -9) 12.1 → 12.8 MiB, i.e. +0.77 MiB (+6 %).
# Without symbols the backtrace loses 634 names and turns into a column of addresses.
debug = 1
strip = "debuginfo"
lto = "thin"
codegen-units = 1

# Audio DSP and compositing must be fast in the dev build too.
#
# `package."*"` covers ONLY DEPENDENCIES; it does not cover our own crates, and before
# R.43 they were built with opt-level 0. On a dense edit of the user’s
# project, audio render in dev went over 100 % of real time (the ring empties,
# callback underruns grow), in release the same spot took 13 %.
# Measurement `kt-cli probe … --time` on problems1 of the owner’s project:
#   opt-level 0 — 119 %, 1 — 21 %, 2 — 15 % of real time.
# Level 1 was chosen: the task is solved, the build stays fast, debugging stays live. Checks
# for overflow and debug_assert! do NOT depend on the optimization level and remain
# enabled — the dev profile’s safety net is intact (item 301).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
