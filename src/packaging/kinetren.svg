<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Kinetren (kt). The silhouette MATCHES the logo inside the program
       (apps/kt-app/src/toolbar.rs::draw_logo): a film frame almost over the whole
       canvas, WITHOUT an outer plate or border (the user's decision, item 6 round 8),
       a flat accent instead of a gradient, perforation by the code's formulas. -->

  <!-- film frame: 92 % of the canvas, rounding ~1 px at 16 px = 8 at 128 -->
  <rect x="5" y="5" width="118" height="118" rx="8" fill="#121418"/>
  <rect x="9" y="9" width="110" height="110" rx="6" fill="none"
        stroke="#4682eb" stroke-width="7"/>

  <!-- perforation: hole 0.13w × 0.17h, centres at 0.22h and 0.66h -->
  <g fill="#464e5c">
    <rect x="14" y="24" width="15" height="20"/>
    <rect x="14" y="65" width="15" height="20"/>
    <rect x="99" y="24" width="15" height="20"/>
    <rect x="99" y="65" width="15" height="20"/>
  </g>

  <!-- kt monogram (strokes, not text — the icon must not depend on
       the system font); height ≈ 0.62 of the frame, as in draw_logo -->
  <g stroke="#e4e9f2" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M45 40 V88"/>
    <path d="M45 66 L59 51"/>
    <path d="M45 66 L60 88"/>
    <path d="M79 45 V80 a6 6 0 0 0 6 6 h3"/>
    <path d="M71 58 H89"/>
  </g>
</svg>
